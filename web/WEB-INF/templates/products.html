<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- LEFT SIDEBAR -->
        <div class="col-md-2 bg-dark text-white p-3">

            <h4 class="mb-4">Menu</h4>

            <ul class="list-group">

                <li class="list-group-item bg-dark border-secondary">
                    <a href="/"
                       class="text-white text-decoration-none">
                        Users
                    </a>
                </li>

                <li class="list-group-item bg-dark border-secondary">
                    <a th:href="@{/user/orders}"
                       class="text-white text-decoration-none">
                        Orders
                    </a>
                </li>

                <li class="list-group-item bg-dark border-secondary">
                    <a th:href="@{/user/products}"
                       class="text-white text-decoration-none">
                        Products
                    </a>
                </li>

            </ul>

        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10">

            <!-- TOP NAVBAR -->
            <div class="d-flex justify-content-between align-items-center
                        bg-white shadow-sm p-3 mb-4">

                <h2>Welcome to Products 🚀</h2>

                <div class="d-flex align-items-center gap-3">
                    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
                        Add product
                    </button>

                    <span class="fw-bold text-primary"
                          th:text="${user.username}">
                        Username
                    </span>

                    <form th:action="@{/logout}">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            Logout
                        </button>
                    </form>

                </div>

            </div>

            <!-- PRODUCTS TABLE -->
            <div class="card shadow mb-4">

                <div class="card-header bg-dark text-white">
                    Products
                    <div>
                        <input id="Sname" placeholder="name" >
                        <input id="Sprice" placeholder="price" >

                        <button onclick="search()">search</button>
                    </div>
                </div>

                <div class="card-body">

                    <div class="row" id="products-container"></div>

                    <div class="d-flex justify-content-end">

                        <button class="btn btn-success"
                                th:onclick="'addOrder(' + ${user.id} + ')'">
                            Add Order
                        </button>

                    </div>

                </div>

            </div>


            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Add product</h5>
                        </div>
                        <div class="modal-body">
                            <form id="product-form" th:action="@{/product}" method="post" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label class="form-label">
                                        Product Name
                                    </label>

                                    <input id="name" type="text"
                                           name="name"
                                           class="form-control"
                                           placeholder="Enter product name"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Product Price
                                    </label>

                                    <input id="price" type="number"
                                           name="price"
                                           class="form-control"
                                           placeholder="Enter product price"
                                           required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        Upload image
                                    </label>
                                    <input id="file" type="file" name="file">
                                </div>

                                <button type="submit" class="btn btn-success w-100">
                                    Add Product
                                </button>

                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
<script>

    // tanlangan productlar
    let selectedProducts = [];



    // productlarni olish
    getProducts();

    function getProducts(){

        fetch("/product")
            .then(response => response.json())
            .then(data => {
                render(data);
            })
            .catch(error => {
                console.log(error);
            });

    }

    // render
    function render(data){

        const container =
            document.getElementById("products-container");

        let temp = "";

        for(let i = 0; i < data.length; i++){

            let product = data[i];

            temp += `

    <div class="col-md-2 mb-2">

        <div class="card shadow-sm h-100">

            <img
                src="/images/${product.imagePath}"
                class="card-img-top"
                style="
                    height:120px;
                    object-fit:cover;
                "
            >

            <div class="card-body p-2 d-flex flex-column">

                <h6 class="card-title mb-1">
                    ${product.name}
                </h6>

                <p class="text-success fw-bold mb-2">
                    $${product.price}
                </p>

                <div class="d-flex align-items-center gap-2 mb-2">

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="decrement(${product.id})">

                        -

                    </button>

                    <span id="qty-${product.id}">
                        1
                    </span>

                    <button
                        class="btn btn-primary btn-sm"
                        onclick="increment(${product.id})">

                        +

                    </button>

                </div>

                <button
                    class="btn btn-success btn-sm mt-auto"
                    id="select-btn-${product.id}"
                    onclick="selectProduct(${product.id})">

                    Select

                </button>

            </div>

        </div>

    </div>

`;
        }

        container.innerHTML = temp;
    }

    // increment
    function increment(id){

        let qty = document.getElementById("qty-" + id);

        let newQty = parseInt(qty.innerText) + 1;

        qty.innerText = newQty;

        updateSelectedQuantity(id, newQty);
    }

    // decrement
    function decrement(id){

        let qty = document.getElementById("qty-" + id);

        let current = parseInt(qty.innerText);

        if(current > 1){

            let newQty = current - 1;

            qty.innerText = newQty;

            updateSelectedQuantity(id, newQty);
        }
    }

    function updateSelectedQuantity(id, qty){

        let product =
            selectedProducts.find(p => p.productId === id);

        if(product){
            product.quantity = qty;
        }
    }

    // select product
    function selectProduct(id){

        let qty = parseInt(
            document.getElementById("qty-" + id).innerText
        );

        let button = document.getElementById("select-btn-" + id);

        let index = selectedProducts.findIndex(
            p => p.productId === id
        );

        // AGAR OLDIN SELECT QILINGAN BO'LSA
        if(index !== -1){

            selectedProducts.splice(index, 1);

            button.classList.remove("btn-secondary");
            button.classList.add("btn-success");

            button.innerText = "Select";

        }else{

            let product = {
                productId : id,
                quantity : qty
            };

            selectedProducts.push(product);

            button.classList.remove("btn-success");
            button.classList.add("btn-secondary");

            button.innerText = "Selected";
        }

        console.log(selectedProducts);
    }

    // order yuborish
    function addOrder(userId){

        if(selectedProducts.length === 0){
            alert("Select at least one product");
            return;
        }

        fetch("/orders", {

            method : "POST",

            headers : {
                "Content-Type" : "application/json"
            },

            body : JSON.stringify({

                userId : userId,

                orderItems : selectedProducts

            })

        })
            .then(response => {

                if(!response.ok){
                    throw new Error("Order failed");
                }

                return response.text();
            })
            .then(data => {
                selectedProducts = [];
                resetButtons();

            })
            .catch(error => {

                console.log(error);

                alert("Something went wrong");

            });
    }

    function resetButtons(){

        let buttons =
            document.querySelectorAll("[id^='select-btn-']");

        buttons.forEach(button => {

            button.classList.remove("btn-secondary");

            button.classList.add("btn-success");

            button.innerText = "Select";

        });

    }

    const form = document.getElementById("product-form");

    form.addEventListener("submit", function () {

        setTimeout(() => clearM(), 300);

    });

    function clearM(){
        document.getElementById("name").value="";
        document.getElementById("price").value="";
        document.getElementById("file").value="";
    }


    function search(){
        let name = document.getElementById("Sname").value;
        let price = document.getElementById("Sprice").value;
        let url = "/product/filter";

        let params = [];

        if (name && name.trim() !== "") {
            params.push("name=" + encodeURIComponent(name));}
        if (price && price.trim() !== "") {
            params.push("price=" + encodeURIComponent(price));
        }

        if (params.length > 0) {
            url += "?" + params.join("&");
        }

        fProduct(url);
    }

    function fProduct(URL){
        fetch(URL).then(res => res.json()).then(data => render(data));
    }
</script>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
