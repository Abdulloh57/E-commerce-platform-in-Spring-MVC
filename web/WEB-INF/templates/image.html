<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Image</title>
</head>
<body>

<h1>Image Upload</h1>

<form th:action="@{/file/upload}" method="post" enctype="multipart/form-data">

    <input type="file" name="file">

    <button type="submit">
        Upload
    </button>

</form>

<h1 th:text="HI"></h1>
<img th:src="${imageUrl}" width="300"/>
</body>
</html>
