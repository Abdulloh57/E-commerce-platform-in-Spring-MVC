<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow" style="width: 450px;">

        <div class="card-body">

            <h3 class="text-center mb-4">Register</h3>

            <form th:action="@{/user/register}" th:object="${user}" method="post">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Enter name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text"
                           th:field="*{username}"
                           class="form-control"
                           placeholder="Enter username"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           th:field="*{password}"
                           class="form-control"
                           placeholder="Enter password"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select th:field="*{role}" class="form-select">

                        <option th:value="${T(library.uz.model.RoleName).USER}">
                            USER
                        </option>

                        <option th:value="${T(library.uz.model.RoleName).ADMIN}">
                            ADMIN
                        </option>

                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Register
                </button>

            </form>
            <!-- LOGIN LINK -->
            <div class="text-center mt-3">
                <small>Already have account?</small>
                <br>
                <a href="/login" class="text-decoration-none">
                    Login here
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
