<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid">

    <div class="row vh-100">

        <!-- 🧭 LEFT MENU -->
        <div class="col-md-4 bg-dark text-white p-3">

            <h4 class="mb-4">Menu</h4>

            <ul class="list-group">
                <li class="list-group-item bg-dark border-secondary p-0">
                    <a href="#"
                       onclick="openUsers()"
                       class="d-block w-100 text-white text-decoration-none p-3">

                        Users
                    </a>
                </li>

                <li class="list-group-item bg-dark border-secondary">
                    <a th:href="@{/user/orders}"
                       class="text-white text-decoration-none">

                        Orders
                    </a>
                </li>

                <li class="list-group-item bg-dark border-secondary">
                    <a th:href="@{/user/products}"
                       class="text-white text-decoration-none">

                        Products
                    </a>
                </li>

            </ul>

        </div>

        <!-- 📦 MAIN CONTENT -->
        <div class="col-md-8 p-4">
            <!-- TOP NAVBAR -->
            <div class="d-flex justify-content-between align-items-center
            bg-white shadow-sm p-3 border-bottom">

                <h2>Welcome to Dashboard 🚀</h2>

                <div class="d-flex align-items-center gap-3">
                    <span class="fw-bold text-primary"
                          th:text="${username}">

                        Username
                    </span>

                    <form th:action="@{/logout}" >
                        <button type="submit" class="btn btn-outline-danger btn-sm" >
                            Logout
                        </button>
                    </form>


                </div>

            </div>



            <p class="text-muted">
                This is main content area. Select menu items on the left.
            </p>

            <table class="table">
                <thead class="table-header">
                    <tr>
                        <th>id</th>
                        <th>username</th>
                        <th>password</th>
                        <th>email</th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>

        </div>

    </div>

</div>

    <script>

        function openUsers(){
            fetch("user/users",{
                headers : {"Content-type":"application/json"}
            }).then(res => res.json())
                .then(data => render(data)).catch(err => console.log(err));
        }

        function render(data){
            const table = document.getElementById("tbody");
            let temp = ""
            for (let  i=0; i<data.length; i++){
                const user = data[i];
                temp += "<tr>" +
                    "<td>"+user.id+"</td>" +
                    "<td>"+user.username+"</td>"+
                    "<td>"+user.password+"</td>"+
                    "<td>"+user.email+"</td>"+
                    "</tr>"
            }
            table.innerHTML = temp;
        }
    </script>

</body>
</html>
